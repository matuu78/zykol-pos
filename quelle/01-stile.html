<style>/* ============================================================
   MK — Mediengruppe Kreiszeitung
   Colors & Type foundation
   Source: MK_Styleguide_2023.pdf (09/2023)
   Import this file plus fonts/fonts.css.
   ============================================================ */

/* MK self-hosted brand fonts — Barlow, Barlow Condensed, Source Serif 4 (Google Fonts, latin subset) */

@font-face{font-family:'Barlow';font-style:italic;font-weight:400;font-display:swap;src:url("assets/fonts/barlow-400-italic.woff2") format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/barlow-400.woff2") format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/barlow-500.woff2") format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/barlow-600.woff2") format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/barlow-700.woff2") format('woff2');}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/barlow-condensed-400.woff2") format('woff2');}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/barlow-condensed-700.woff2") format('woff2');}
@font-face{font-family:'Source Serif 4';font-style:italic;font-weight:400;font-display:swap;src:url("assets/fonts/source-serif-4-400-italic.woff2") format('woff2');}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/source-serif-4-400.woff2") format('woff2');}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/source-serif-4-600.woff2") format('woff2');}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/source-serif-4-700.woff2") format('woff2');}


:root {
  /* ---- Brand palette (HEX from styleguide "Die MK Farbdefinition") ---- */
  --mk-dunkelblau:  #003255;  /* primary — Pantone 7463 C */
  --mk-hellblau:    #7896BE;  /* rubric: Service */
  --mk-ultramarin:  #059FA7;  /* rubric: Reisen (teal) */
  --mk-sandgrau:    #A59B91;  /* warm neutral */
  --mk-brombeere:   #A0145A;  /* rubric: Shop (magenta) */
  --mk-orange:      #F28A3D;  /* rubric: Tickets */
  --mk-lichtgrau:   #DFE6EB;  /* page tint / light surface */

  /* ---- Dunkelblau tint ladder (100 / 80 / 60 / 40 / 20 %) ---- */
  --mk-dunkelblau-80: #335b76;
  --mk-dunkelblau-60: #668498;
  --mk-dunkelblau-40: #99adba;
  --mk-dunkelblau-20: #ccd6dd;

  /* ---- Tints of accents (approx 60% mixes toward white, for fills/bg) ---- */
  --mk-hellblau-20:   #e4eaf2;
  --mk-ultramarin-20: #ccecee;
  --mk-brombeere-20:  #ecccdd;
  --mk-orange-20:     #fce8d8;
  --mk-sandgrau-20:   #edebe8;

  /* ---- Semantic surfaces & ink ---- */
  --mk-ink:         #003255;   /* default heading ink = Dunkelblau */
  --mk-body:        #1c2b35;   /* near-black body text (warmer than pure black) */
  --mk-body-soft:   #54636d;   /* secondary text */
  --mk-black:       #16181a;   /* reinschwarz (true black usage) */
  --mk-bg:          #ffffff;   /* logo bg is always white */
  --mk-bg-tint:     #DFE6EB;   /* Lichtgrau surface */
  --mk-bg-tint-soft:#eef2f6;   /* ~50% Lichtgrau */
  --mk-line:        #ccd6dd;   /* hairline / borders (Dunkelblau 20%) */
  --mk-line-soft:   #e4eaf0;

  /* Rubric → color map (sections/products) */
  --rubrik-service: var(--mk-hellblau);
  --rubrik-tickets: var(--mk-orange);
  --rubrik-reisen:  var(--mk-ultramarin);
  --rubrik-shop:    var(--mk-brombeere);

  /* ---- Type families ---- */
  --font-sans:  'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-cond:  'Barlow Condensed', 'Barlow', sans-serif;     /* tight space only */
  --font-serif: 'Source Serif 4', 'Source Serif Pro', Georgia, serif; /* logo / display */

  /* ---- Type scale (px) — Barlow-driven UI/editorial ---- */
  --fs-display: 56px;   /* hero display */
  --fs-h1: 40px;
  --fs-h2: 30px;
  --fs-h3: 23px;
  --fs-h4: 19px;
  --fs-lead: 20px;
  --fs-body: 17px;
  --fs-small: 15px;
  --fs-caption: 13px;
  --fs-kicker: 13px;    /* uppercase eyebrow */

  /* ---- Signature MK frame / corner motif ---- */
  /* One sharp corner (top-left), the rest rounded — the "Gestaltungsrahmen". */
  --mk-radius: 16px;
  --mk-radius-lg: 26px;
  --mk-frame-radius: 0 var(--mk-radius-lg) var(--mk-radius-lg) var(--mk-radius-lg);
  /* Price-field: two diagonally-opposite rounded corners. */
  --mk-price-radius: 14px 0 14px 0;

  /* ---- Elevation (the brand is flat/print; shadows are subtle) ---- */
  --mk-shadow-sm: 0 1px 2px rgba(0,50,85,.06);
  --mk-shadow-md: 0 4px 16px rgba(0,50,85,.10);
  --mk-shadow-lg: 0 12px 40px rgba(0,50,85,.14);

  /* ---- Spacing scale (4px base) ---- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px;
}

/* ============================================================
   Semantic element styles — opt in with class .mk
   ============================================================ */
.mk { color: var(--mk-body); font-family: var(--font-sans); font-size: var(--fs-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }

.mk h1, .mk-h1 { font-family: var(--font-sans); font-weight: 700; font-size: var(--fs-h1); line-height: 1.1; letter-spacing: -.01em; color: var(--mk-ink); margin: 0; }
.mk h2, .mk-h2 { font-family: var(--font-sans); font-weight: 700; font-size: var(--fs-h2); line-height: 1.15; color: var(--mk-ink); margin: 0; }
.mk h3, .mk-h3 { font-family: var(--font-sans); font-weight: 600; font-size: var(--fs-h3); line-height: 1.25; color: var(--mk-ink); margin: 0; }
.mk h4, .mk-h4 { font-family: var(--font-sans); font-weight: 600; font-size: var(--fs-h4); line-height: 1.3; color: var(--mk-ink); margin: 0; }

.mk-display { font-family: var(--font-sans); font-weight: 700; font-size: var(--fs-display); line-height: 1.04; letter-spacing: -.02em; color: var(--mk-ink); }
.mk-serif-display { font-family: var(--font-serif); font-weight: 400; font-size: var(--fs-display); line-height: 1.05; color: var(--mk-ink); }

.mk-lead { font-size: var(--fs-lead); line-height: 1.5; color: var(--mk-body); }
.mk-p, .mk p { font-size: var(--fs-body); line-height: 1.6; color: var(--mk-body); margin: 0 0 1em; text-wrap: pretty; }
.mk-small { font-size: var(--fs-small); line-height: 1.5; }
.mk-caption { font-family: var(--font-sans); font-style: italic; font-size: var(--fs-caption); color: var(--mk-body-soft); } /* Barlow Italic = captions & quotes */

.mk-kicker { font-family: var(--font-sans); font-weight: 700; font-size: var(--fs-kicker); letter-spacing: .12em; text-transform: uppercase; }

/* Rubric helpers */
.rubrik-service { color: var(--rubrik-service); }
.rubrik-tickets { color: var(--rubrik-tickets); }
.rubrik-reisen  { color: var(--rubrik-reisen); }
.rubrik-shop    { color: var(--rubrik-shop); }
</style>
